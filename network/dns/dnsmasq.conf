cache-size=4096
listen-address=127.0.0.1,::1
no-resolv
domain-needed
bogus-priv
strict-order

# Tailscale MagicDNS: forward .ts.net / tailb8263.ts.net to Tailscale DNS
# Allows MagicDNS to work with --accept-dns=false (dnsmasq as sole resolver)
server=/ts.net/100.100.100.100
server=/ts.net/fd7a:115c:a1e0::53
server=/tailb8263.ts.net/100.100.100.100
server=/tailb8263.ts.net/fd7a:115c:a1e0::53

# NextDNS anycast endpoints — profile 21553f identified via add-cpe-id below.
# Keep in sync with nix/core/settings.nix (nextdns* constants).
server=2a07:a8c0::
server=2a07:a8c1::
server=45.90.28.0
server=45.90.30.0
add-cpe-id=21553f
