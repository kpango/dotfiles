[Resolve]
# NextDNS profile 21553f, strict Zero Leak design via systemd-resolved DoT with SNI
# authentication. Profile is identified by the SNI hostname (21553f.dns.nextdns.io),
# not source IP — WAN-independent, works regardless of which WAN egress is active.
# No FallbackDNS: when NextDNS is unreachable, DNS fails closed rather than leak to a
# non-NextDNS resolver (ad-block / parental control / logs stay enforced).
# Keep in sync with nix/core/settings.nix.
DNS=2a07:a8c0::#21553f.dns.nextdns.io
DNS=45.90.28.0#21553f.dns.nextdns.io
DNS=2a07:a8c1::#21553f.dns.nextdns.io
DNS=45.90.30.0#21553f.dns.nextdns.io
FallbackDNS=
DNSSEC=allow-downgrade
DNSOverTLS=yes
Cache=yes
