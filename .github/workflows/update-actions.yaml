name: Update GitHub Actions version pins

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Daily at 03:00 JST

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-actions
  cancel-in-progress: true

jobs:
  update:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Every file this job rewrites lives under .github/workflows/ (pinact,
    # ghatm, and both update/versions/* targets -- see Makefile.d/update.mk),
    # and GitHub refuses any push that touches a workflow file unless the token
    # carries the `workflow` scope. GITHUB_TOKEN can never carry it, so without
    # GH_PAT the push is rejected with "refusing to allow a GitHub App to create
    # or update workflow ... without `workflows` permission" -- which is what
    # failed this job every day from 2026-10-04 to 2026-10-13. The secrets
    # context is not available in a step-level `if`, so the presence check is
    # hoisted into a job-level env var here.
    env:
      HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GH_PAT must be a PAT with the 'workflow' scope to allow modifying
          # .github/workflows/ files. GITHUB_TOKEN is blocked by GitHub for this.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install tools
        run: |
          go install github.com/suzuki-shunsuke/pinact/cmd/pinact@latest
          go install github.com/suzuki-shunsuke/ghatm/cmd/ghatm@latest
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update action version tags
        run: make update/versions/actions update/versions/tools
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Pin actions to SHA
        run: pinact run
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set timeout-minutes
        run: ghatm set

      - name: Validate workflow syntax and rules
        run: actionlint

      - name: Check for changes
        id: check_diff
        run: |
          if git diff --quiet --exit-code; then
            echo "Nothing updated"
          else
            git diff
            echo "HAS_GIT_DIFF=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip pull request (no GH_PAT configured)
        if: steps.check_diff.outputs.HAS_GIT_DIFF == 'true' && env.HAS_GH_PAT != 'true'
        run: |
          echo "::warning title=GH_PAT not configured::Version pins were updated but cannot be pushed: a branch touching .github/workflows/ needs a token with the 'workflow' scope, and only GITHUB_TOKEN is available. Add a PAT with 'repo' + 'workflow' scope as the GH_PAT repository secret (gh secret set GH_PAT --repo ${{ github.repository }}) and this job starts opening PRs again with no code change."

      - name: Create pull request
        if: steps.check_diff.outputs.HAS_GIT_DIFF == 'true' && env.HAS_GH_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -x
          BRANCH="update/actions-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$BRANCH"
          git add .github/
          git commit -m "Update GitHub Actions version pins"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --title "Update GitHub Actions version pins" \
            --body "Automated pull request to update GitHub Actions version pins." \
            --base main \
            --head "$BRANCH"
