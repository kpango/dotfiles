auto-activate true
bogus-priv true
cache-max-age 5m0s
cache-metrics false
cache-size 10MB
control /var/run/nextdns.sock
debug false
detect-captive-portals false
discovery-dns
hardened-privacy false
listen localhost:53
log-queries false
max-inflight-requests 256
max-ttl 5m0s
mdns all
profile 21553f
report-client-info true
setup-router true
timeout 5s
use-hosts true
forwarder tailb8263.ts.net.=100.100.100.100
forwarder 100.in-addr.arpa.=100.100.100.100
