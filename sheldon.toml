shell = "zsh"

apply = ["defer"]

[plugins]
[plugins.zsh-defer]
github = 'romkatv/zsh-defer'
apply = ['source']

# Every `-t` call site in this config is a yield point, never a real delay (see
# [plugins.colors]); this makes every `zsh-defer -t` in the session one. Upstream arms a
# `<(zselect -t N)` timer for -t, which forks and then sleeps >=10ms per yield point --
# ~55ms of pure idle across the queue. An always-readable fd returns control to zle's
# main loop just the same, so a keypress queued meanwhile is still served before the
# next chunk (with this whole change, keystroke echo while the queue drains measured
# 2026-10-21 under a pty: max 6.1ms vs 11.8ms before), only without the sleep or fork.
# Replaces upstream's function only while schedule and resume (whose contract it relies
# on) are the 53a26e2 bodies, checked by length -- a same-length edit would slip
# through; otherwise upstream's timer stays. Inline plugins are templates too, so
# `${#...}` (whose `{#` opens a template comment) is spelled `$#...` here.
[plugins.zsh-defer-yield]
inline = '''
if (($#functions[_zsh-defer-schedule] == 149 && $#functions[_zsh-defer-resume] == 428)); then
  _zsh-defer-schedule() { local fd; exec {fd}</dev/null; zle -F $fd _zsh-defer-resume }
fi
'''

# zsh-completions only adds to fpath (no completion function needs to exist yet), so it
# must run before [plugins.compinit] scans fpath — it used to be registered after compinit
# (queued later ⇒ runs later) and its ~242 completions were silently never picked up.
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ['defer']

[plugins.compinit]
# .zcompdump existence alone doesn't imply freshness: also force a full compinit once the
# dump is more than 24h old (#qN.mh+24 glob qualifier). `(){ setopt local_options
# extended_glob; ... }` is required here, not just a global `setopt extended_glob`
# elsewhere: every zsh-defer task runs inside _zsh-defer-resume's `emulate -L zsh`, which
# resets options (including extended_glob) to the zsh baseline for the task's own
# duration regardless of what's set globally, so the glob qualifier would otherwise be
# parsed as a literal (always-true) string match and this branch never take the -C path.
# N=nullglob so a missing file still falls through to the full-compinit branch.
inline = 'zsh-defer -mprs -c "autoload -Uz compinit && () { setopt local_options extended_glob; local _zcd=\${ZDOTDIR:-\$HOME}/.zcompdump; if [[ ! -f \$_zcd ]] || [[ -n \$_zcd(#qN.mh+24) ]]; then compinit; else compinit -C; fi }"'

# -t 0.01 opens a yield point: without it _zsh-defer-resume drains its whole queue
# inside a single `zle -F` callback, and the `!KEYS_QUEUED_COUNT && !PENDING` guard in
# that loop cannot see a keypress that arrives *during* the callback (zsh only refreshes
# those parameters while zle itself is reading), so the first keystroke after the prompt
# is echoed only once every task has finished. On a non-zero delay _zsh-defer-resume
# instead schedules a fresh fd and returns to zle's main loop for real. Yield points are
# placed to cap each chunk at ~20ms rather than on every task; [plugins.zsh-defer-yield]
# makes each one an immediate return to zle rather than the upstream >=10ms timer.
[plugins.colors]
inline = 'autoload -Uz colors && zsh-defer -mprs -t 0.01 colors'

[plugins.fzf]
github = 'junegunn/fzf'
apply = ['fzf-install', 'fzf-source']

[plugins.kubectl-fzf]
remote = "https://raw.githubusercontent.com/bonnefoa/kubectl-fzf/main/shell/kubectl_fzf.plugin.zsh"

[plugins.bun-completions-zsh]
remote = "https://raw.githubusercontent.com/oven-sh/bun/refs/heads/main/completions/bun.zsh"
apply = ["bun-fpath"]

[plugins.prmt]
inline = 'if [[ -t 0 ]]; then autoload -Uz _prmt_init && _prmt_init; fi'

# Same shape as [plugins.atuin]: _zcache_eval's own deferred-source path leaves precmd
# hooks enabled, and every deferred task that fires precmd starts another async prmt
# render. Now that the queue is split across several zle callbacks (see
# [plugins.colors]) those renders are no longer coalesced into a single repaint, so
# the prompt visibly flickers while the queue drains.
[plugins.zoxide]
inline = '''
if (($+commands[zoxide])); then
  if [[ -f "$ZCACHE_DIR/zoxide.zsh" && ! "$commands[zoxide]" -nt "$ZCACHE_DIR/zoxide.zsh" ]]; then
    zsh-defer -mprs source "$ZCACHE_DIR/zoxide.zsh"
  else
    zsh-defer -mprs _zcache_eval zoxide 0 "zoxide init zsh" "$commands[zoxide]"
  fi
fi
'''

[plugins.atuin]
inline = '''
if (($+commands[atuin])); then
  autoload -Uz _atuin_init
  # _atuin_init is a dependency too: it patches atuin's output, so an edit to it must
  # regenerate the cache just like a new atuin binary does.
  if [[ -f "$ZCACHE_DIR/atuin.zsh" && ! "$commands[atuin]" -nt "$ZCACHE_DIR/atuin.zsh" &&
    ! "$DOTFILES_DIR/zfunc/_atuin_init" -nt "$ZCACHE_DIR/atuin.zsh" ]]; then
    zsh-defer -mprs source "$ZCACHE_DIR/atuin.zsh"
  else
    zsh-defer -mprs _zcache_eval atuin 0 "_atuin_init" "$commands[atuin]" "$DOTFILES_DIR/zfunc/_atuin_init"
  fi
fi
'''

# Same shape as [plugins.atuin]: _zcache_eval's own deferred-source path leaves precmd
# hooks enabled, and every deferred task that fires precmd starts another async prmt
# render. Now that the queue is split across several zle callbacks (see
# [plugins.colors]) those renders are no longer coalesced into a single repaint, so
# the prompt visibly flickers while the queue drains.
[plugins.pay-respects]
inline = '''
if (($+commands[pay-respects])); then
  if [[ -f "$ZCACHE_DIR/pay-respects.zsh" && ! "$commands[pay-respects]" -nt "$ZCACHE_DIR/pay-respects.zsh" ]]; then
    zsh-defer -mprs source "$ZCACHE_DIR/pay-respects.zsh"
  else
    zsh-defer -mprs _zcache_eval pay-respects 0 "pay-respects zsh" "$commands[pay-respects]"
  fi
fi
'''

# Same shape as [plugins.atuin]: _zcache_eval's own deferred-source path leaves precmd
# hooks enabled, and every deferred task that fires precmd starts another async prmt
# render. Now that the queue is split across several zle callbacks (see
# [plugins.colors]) those renders are no longer coalesced into a single repaint, so
# the prompt visibly flickers while the queue drains.
[plugins.zsh-patina]
inline = '''
if (($+commands[zsh-patina])); then
  if [[ -f "$ZCACHE_DIR/zsh-patina.zsh" && ! "$commands[zsh-patina]" -nt "$ZCACHE_DIR/zsh-patina.zsh" ]]; then
    zsh-defer -mprs source "$ZCACHE_DIR/zsh-patina.zsh"
  else
    zsh-defer -mprs _zcache_eval zsh-patina 0 "zsh-patina activate" "$commands[zsh-patina]"
  fi
fi
'''

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ['defer']

# Queued right after the plugin, before the precmd that does its widget binding; see
# zfunc/_autosuggest_cached_bind.
[plugins.autosuggest-cached-bind]
inline = 'autoload -Uz _autosuggest_cached_bind && zsh-defer -mprs _autosuggest_cached_bind'

[plugins.tmux-xpanes]
github = "greymd/tmux-xpanes"
# Its plugin file (activate.sh + completion.zsh as of 63991ae) only appends {{ dir }}/bin
# to PATH when xpanes is not already found, and {{ dir }}/completion/zsh/ to fpath, but
# finds {{ dir }} via several dirname/cd subshells; sheldon already knows it. Re-check
# xpanes-path below if upstream's plugin file grows. Unlike the deferred source it
# replaces, this runs before the deferred compinit, so xpanes' completions now register.
apply = ['xpanes-path']

# Intentionally runs with -mprs: async compilation in the background does not alter
# prompt or ZLE state, so precmd hooks, reset-prompt, zle -R, and autosuggestion resets
# are all disabled to eliminate double _prmt_precmd and prompt flicker.
[plugins.async-compile]
inline = '''zsh-defer -mprs -t 0.01 -c "(
  [[ ! -f ~/.zshrc.zwc || ~/.zshrc -nt ~/.zshrc.zwc ]] && zcompile -U -R ~/.zshrc 2>/dev/null
  [[ ! -f ~/.zshenv.zwc || ~/.zshenv -nt ~/.zshenv.zwc ]] && zcompile -U -R ~/.zshenv 2>/dev/null
  [[ ! -f ~/.zcompdump.zwc || ~/.zcompdump -nt ~/.zcompdump.zwc ]] && zcompile -U -M ~/.zcompdump 2>/dev/null
  [[ ! -f \$DOTFILES_DIR/zsh/01-tmux.zsh.zwc || \$DOTFILES_DIR/zsh/01-tmux.zsh -nt \$DOTFILES_DIR/zsh/01-tmux.zsh.zwc ]] && zcompile -U -R \$DOTFILES_DIR/zsh/01-tmux.zsh 2>/dev/null
  for f in \$DOTFILES_DIR/zfunc/*(N.); do
      [[ \${f:e} == zwc ]] && continue
      [[ ! -f \$f.zwc || \$f -nt \$f.zwc ]] && zcompile -U -z \$f 2>/dev/null
  done
  for f in \${XDG_DATA_HOME:-\$HOME/.data}/sheldon/repos/**/*.zsh(N) \${XDG_DATA_HOME:-\$HOME/.data}/sheldon/downloads/**/*.zsh(N); do
      [[ ! -f \$f.zwc || \$f -nt \$f.zwc ]] && zcompile -U -R \$f 2>/dev/null
  done
  # -1 (regenerate, no source) and only when stale: with 0 this subshell sourced the whole
  # combined.zsh on every startup, re-running its tmux/atuin/gpg side effects a second time.
  _zn=(\"\$DOTFILES_DIR/zsh\"/*.zsh(N.om[1]))
  if [[ -n \$_zn && \$_zn -nt \$ZCACHE_DIR/combined.zsh ]]; then
      _zcache_eval combined -1 'for _f in \"\$DOTFILES_DIR/zsh\"/*.zsh(N); do [[ \"\${_f:t}\" = 20-os-*.zsh || \"\${_f:t}\" = 01-tmux.zsh ]] || print -r -- \"\$(<\"\$_f\")\"; done'
  fi
  _scfg=\"\${XDG_CONFIG_HOME:-\$HOME/.config}/sheldon/plugins.toml\"
  if [[ \"\$_scfg\" -nt \"\$ZCACHE_DIR/sheldon.zsh\" ]]; then
      _zcache_eval sheldon -1 \"sheldon source\" \"\$_scfg\"
  fi
  if (($+commands[direnv])) && [[ \"\$commands[direnv]\" -nt \"\$ZCACHE_DIR/direnv.zsh\" ]]; then
      _zcache_eval direnv -1 \"direnv hook zsh\" \"\$commands[direnv]\"
  fi
  if [[ ${OSTYPE} == "darwin"* && -x /usr/libexec/path_helper ]] && [[ /etc/paths -nt \"\$ZCACHE_DIR/path_helper.zsh\" || /etc/paths.d -nt \"\$ZCACHE_DIR/path_helper.zsh\" ]]; then
      _zcache_eval path_helper -1 \"/usr/libexec/path_helper -s\" /etc/paths /etc/paths.d
  fi
  for f in \$ZCACHE_DIR/*.zsh(N); do
      [[ ! -f \$f.zwc || \$f -nt \$f.zwc ]] && zcompile -U -R \$f 2>/dev/null
  done
) &|"'''

[templates]
defer = "zsh-defer -mprs -c \"{% for file in files %}source '{{ file }}'\n{% endfor %}\""
fzf-install = "if ! (($+commands[fzf])); then [[ -x '{{ dir }}/bin/fzf' ]] || '{{ dir }}/install' --bin >/dev/null; path+=('{{ dir }}/bin'); fi\n"
# The sed filter is cached via _zcache_eval instead of `source <(sed ...)`, which forked
# sed once per file on every startup. Regenerated when the fzf file or this config (which
# holds the filter) changes; inline fast-path sources the cache directly on warm hits.
fzf-source = "zsh-defer -mprs -c \"_scfg=\\\"\\${XDG_CONFIG_HOME:-\\$HOME/.config}/sheldon/plugins.toml\\\"; {% for file in files %}_fn=fzf-\\${\\${:-'{{ file }}'}:t:r}; _fc=\\\"\\$ZCACHE_DIR/\\$_fn.zsh\\\"; if [[ -f \\\"\\$_fc\\\" && ! '{{ file }}' -nt \\\"\\$_fc\\\" && ! \\\"\\$_scfg\\\" -nt \\\"\\$_fc\\\" ]]; then source \\\"\\$_fc\\\"; else _zcache_eval \\\"\\$_fn\\\" 0 \\\"sed -e '/bindkey.*fzf-history-widget/d' '{{ file }}'\\\" '{{ file }}' \\\"\\$_scfg\\\"; fi; unset _fn _fc; {% endfor %}unset _scfg\""
xpanes-path = "whence xpanes tmux-xpanes >/dev/null || path+=(\"{{ dir }}/bin\")\nfpath+=(\"{{ dir }}/completion/zsh/\")\n"
bun-fpath = "[[ -e '{{ dir }}/_bun' ]] || ln -s '{{ dir }}/bun.zsh' '{{ dir }}/_bun' 2>/dev/null\nfpath+=('{{ dir }}')\n"
