model:
  provider: openai
  default: gpt-6.2-astra
  aliases:
    ultrabrain: anthropic/claude-opus-5-5
    deep: openai/gpt-6.2-astra
    quick: anthropic/claude-haiku-5-5
    local: ollama/gpt-oss-20b

terminal:
  backend: local
  cwd: "."

approvals:
  mode: smart
  timeout: 300

skills:
  creation_nudge_interval: 15
  external_dirs:
    - ~/.hermes/skills
    - ~/.omh/skills

platform_toolsets:
  acp:
    - file
    - web
    - skills
    - memory

plugins:
  entries:
    omh:
      enabled: true
      settings:
        omh_home: ~/.omh/profiles/sec-reviewer
        lsp_tools: true
        dreaming_mode: off
