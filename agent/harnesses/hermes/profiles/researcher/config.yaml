model:
  provider: opencode-go
  default: kimi-k3.1-pro
  aliases:
    ultrabrain: anthropic/claude-opus-5-5
    deep: antigravity-cli/gemini-4-argon
    quick: opencode-go/deepseek-v4.1-flash
    web: antigravity-cli/gemini-4-hydrogen
    local: ollama/gpt-oss-20b

terminal:
  backend: local
  cwd: "."

approvals:
  mode: smart
  timeout: 300

skills:
  creation_nudge_interval: 15
  external_dirs:
    - ~/.hermes/skills
    - ~/.omh/skills

platform_toolsets:
  acp:
    - file
    - web
    - skills
    - memory

plugins:
  entries:
    omh:
      enabled: true
      settings:
        omh_home: ~/.omh/profiles/researcher
        lsp_tools: false
        dreaming_mode: off
