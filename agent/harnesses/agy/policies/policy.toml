# ------------------------------------------------------------------------------
# Priority 200: Direct Git Write/Sync Operations (run_shell_command)
# ------------------------------------------------------------------------------
[[rules]]
toolName = "run_shell_command"
commandPrefix = [
  "git add",
  "git commit",
  "git push",
  "git rebase",
  "git reset",
  "git clean",
  "git merge",
  "git fetch",
  "git pull"
]
decision = "deny"
priority = 200
denyMessage = "Direct write/sync Git operations are restricted by local policy. Use worktrees and make targets."

# ------------------------------------------------------------------------------
# Priority 200: Direct Git Write/Sync Operations (run_command)
# ------------------------------------------------------------------------------
[[rules]]
toolName = "run_command"
commandPrefix = [
  "git add",
  "git commit",
  "git push",
  "git rebase",
  "git reset",
  "git clean",
  "git merge",
  "git fetch",
  "git pull"
]
decision = "deny"
priority = 200
denyMessage = "Direct write/sync Git operations are restricted by local policy. Use worktrees and make targets."

