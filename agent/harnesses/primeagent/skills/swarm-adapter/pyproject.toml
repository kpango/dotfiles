# Thin kernel-side adapter: all logic stays in the existing swarm scripts (called via
# subprocess). Stdlib only; prime-agent-runtime is intentionally not declared.
[project]
name = "swarm-adapter"
version = "0.1.0"
description = "Prime Agent swarm-adapter: typed async API over the existing swarm shell/python scripts"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_adapter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
