# hypridle configuration — kpango (ロック画面なし、DPMS のみ管理)
# requires: hypridle (hypridle パッケージ)

general {
    # ロック画面なし: before/after sleep は DPMS オフのみ
    before_sleep_cmd = hyprctl dispatch dpms off
    after_sleep_cmd  = hyprctl dispatch dpms on
    inhibit_sleep    = 0
}

# 10 分無操作で DPMS オフ
listener {
    timeout  = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
