[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
RestartSec=5s
# tailscaled is "started" before it assigns the tailnet IP, so sshd's ListenAddress bind failed and only the
# 5s restart recovered it. Wait (bounded at 30s, then let sshd fail/restart as before) for the configured address.
ExecStartPre=/bin/sh -c 'a=$$(sed -n "s/^ListenAddress //p" /etc/ssh/sshd_config.d/11-tailscale-addr.conf 2>/dev/null); [ -n "$$a" ] || exit 0; i=0; until ip -4 -o addr show | grep -qF " $$a/"; do i=$$((i+1)); [ $$i -ge 60 ] && exit 0; sleep 0.5; done'
