# Zen2 Optimization Flags (Threadripper 3990X)
CFLAGS="-march=znver2 -mtune=znver2 -O3 -pipe -fno-plt -fexceptions -fno-ident -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
LDFLAGS="-Wl,-O3 -Wl,--as-needed -Wl,--gc-sections -Wl,--hash-style=gnu -Wl,-z,now -fuse-ld=mold"
RUSTFLAGS="-C opt-level=3 -C target-cpu=znver2 -C link-arg=-fuse-ld=mold"
MAKEFLAGS="-j128"
BUILDDIR=/tmp/makepkg
BUILDENV=(!distcc color ccache check !sign)
PKGDEST=/tmp/pakku-kpango
COMPRESSZST=(zstd -c -z -q -T0 --fast -3 -)
