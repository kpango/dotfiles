# DXVK Configuration for Ace Combat 7 (Skies Unknown)
# Place in game directory or pass via DXVK_CONFIG_FILE

# Graphics Pipeline Library (GPL) / Shader compile optimizations
# GPL is enabled by default on modern drivers supporting VK_EXT_graphics_pipeline_library (NVIDIA 535+)
dxvk.enableGraphicsPipelineLibrary = True

# Async pipeline compilation (if using GE-Proton / async DXVK builds)
dxvk.enableAsync = True

# Framerate limiter (helps stabilize UE4 physics and eliminate micro-stutter)
# Can also be managed via MangoHud
# dxvk.frameRate = 60

# Device filtering (uncomment if multi-GPU setup to force discrete GPU)
# dxvk.deviceFilter = "GeForce RTX 2070 SUPER"

# Hud configuration (optional: fps, frametimes, devinfo)
# dxvk.hud = fps,frametimes
